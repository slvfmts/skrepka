name: Release to PyPI

# Publishes on an annotated version tag, e.g. `git tag -a v0.9.0 -m 0.9.0 && git push --tags`.
# The tag name (minus the leading `v`) MUST equal skrepka.__version__ / the
# pyproject version, or the run fails before building.
#
# ONE-TIME SETUP (maintainer, on the PyPI side — no secrets stored in the repo):
#   The `skrepka` project does not exist on PyPI yet, so you cannot use a
#   project-scoped publisher. Configure a PENDING publisher on your ACCOUNT's
#   publishing page (PyPI → Your account → Publishing → Add a pending publisher):
#     PyPI project name: skrepka
#     owner: slvfmts   repo: skrepka
#     workflow: release.yml   environment: pypi
#   PyPI creates the project on the first successful OIDC upload. After that the
#   pending publisher becomes a normal project publisher.
#   Also enable 2FA on the account and create a GitHub environment named `pypi`
#   (Settings → Environments).
#   Docs: https://docs.pypi.org/trusted-publishers/creating-a-project-through-oidc/

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    name: validate + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # full history for the leak scan and tag inspection
      - name: reject lightweight tags
        run: |
          # actions/checkout leaves refs/tags/<name> pointing straight at the
          # commit, so `git cat-file -t` reports "commit" even for a properly
          # annotated tag — the check rejected every release until this fetch
          # was added. Re-fetch the real tag object before inspecting it.
          git fetch --force --no-recurse-submodules origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; use an annotated tag (git tag -a)"; exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" build twine ruff==0.16.0
      - name: tag must match the built package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # importlib.metadata reflects the version the wheel/sdist actually
          # carry (resolved from pyproject/__init__), so a drift in either source
          # is caught, not just the __init__ string.
          VER="$(python -c 'import importlib.metadata as m; print(m.version("skrepka"))')"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match built version ($VER)"; exit 1
          fi
      - run: ruff check src/ tests/
      - run: python -m pytest -q
      - run: python -m build
      - run: twine check dist/*
      - name: assert sdist excludes private paths
        run: |
          python - <<'PY'
          import glob, sys, tarfile
          sd = glob.glob("dist/*.tar.gz")
          if len(sd) != 1:
              sys.exit(f"expected exactly one sdist, got {sd}")
          with tarfile.open(sd[0]) as t:
              bad = [m.name for m in t.getmembers()
                     if (any(p in m.name for p in
                             ("/internal/", "/venv/", "/.venv/", "/docs/img/"))
                         or m.name.endswith("/docs/QUICKSTART.md"))]
          if bad:
              sys.exit(f"private paths leaked into sdist: {bad}")
          print("sdist guard OK:", sd[0])
          PY
      - name: gitleaks (full history)
        run: |
          curl -fsSLo gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
