[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skrepka"
dynamic = ["version"]  # single-sourced from src/skrepka/__init__.py (below)
description = "Careful collaborative editing for Google Docs: reply to comments and edit text without ghosting anchors and without flattening styles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Slava Ufimtsev" }]
keywords = ["google-docs", "comments", "editing", "markdown", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.1",
    "beautifulsoup4>=4.12",
    "markdownify>=0.11",
    "markdown-it-py>=3.0",
    "requests>=2.31",
]

[project.optional-dependencies]
svg = ["cairosvg>=2.7"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
skrepka = "skrepka.cli:main"

[project.urls]
Homepage = "https://github.com/slvfmts/skrepka"
Issues = "https://github.com/slvfmts/skrepka/issues"

[tool.hatch.version]
path = "src/skrepka/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/skrepka"]

# Explicit allowlist: the sdist ships only the package, its tests, the agent
# contract, and public docs. Never the `internal/` working context (plans,
# backups, screenshots, test doc IDs) or the local venv.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/agents",
    "/skills",
    "/.claude-plugin",
    "/docs",
    "/README.md",
    "/README.en.md",
    "/PRIVACY.md",
    "/SECURITY.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# Correctness-focused lint gate. Pinned explicitly so CI does not drift with
# ruff's evolving defaults. We deliberately do NOT enforce line-length (E501)
# or import sorting (I) on the reviewed, frozen engine, whose dense Google Docs
# batchUpdate literals and function-local deferred imports are intentional.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
